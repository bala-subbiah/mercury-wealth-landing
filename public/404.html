<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F5F3" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Mercury Wealth</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Standalone page: it is served outside the app bundle, so the token
         values are written out literally here and the self-hosted fonts are
         not available. Families fall back to Georgia / system sans by design.
         No JavaScript. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow-x: clip;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #f4f5f3; /* --color-paper */
        color: #1b2536; /* --color-ink */
        font-family: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding: 64px 24px;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #5e6572; /* --color-muted-light */
      }

      .label::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #856223; /* --color-brass-deep */
      }

      h1 {
        margin-top: 20px;
        max-width: 16em;
        font-family: "Source Serif 4 Variable", Georgia, serif;
        font-weight: 400;
        font-style: normal;
        font-size: clamp(32px, 6vw, 56px);
        line-height: 1.12;
        letter-spacing: -0.01em;
      }

      .home {
        display: inline-block;
        margin-top: 32px;
        padding-bottom: 2px;
        color: #2c3546; /* --color-body-light */
        text-decoration: none;
        border-bottom: 1px solid #d8dad4; /* --rule-light */
        transition:
          color 200ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .home:hover {
        color: #856223;
        border-bottom-color: #856223;
      }

      .home:focus-visible {
        outline: 2px solid #856223;
        outline-offset: 3px;
        border-radius: 2px;
      }

      @media (min-width: 768px) {
        .wrap {
          padding-inline: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="label">404</p>
      <h1>Sorry, we can't find that page.</h1>
      <a class="home" href="/">Go back home</a>
    </main>
  </body>
</html>
