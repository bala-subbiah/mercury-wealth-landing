<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfb" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Mercury Wealth</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Standalone page: it is served outside the app bundle, so the token
         values (design.md amendment 3) are written out literally here and the
         self-hosted fonts are not available. The display face falls back to the
         same neo-grotesque stack the tokens name after Hanken Grotesk, so the
         register survives. Monochrome throughout. No JavaScript. -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow-x: clip;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #fcfcfb; /* --color-paper */
        color: #0d0d0d; /* --color-ink */
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding: 64px 24px;
      }

      .label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #404040; /* --color-body-light — 10.1:1 on paper */
      }

      .label::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0d0d0d; /* --color-ink */
      }

      h1 {
        margin-top: 20px;
        max-width: 16em;
        font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif; /* --font-display, sans the webfont */
        font-weight: 300;
        font-style: normal;
        font-size: clamp(32px, 6vw, 60px);
        line-height: 1.02;
        letter-spacing: -0.025em;
      }

      .home {
        display: inline-block;
        margin-top: 32px;
        padding-bottom: 2px;
        color: #0d0d0d; /* --color-ink */
        text-decoration: none;
        border-bottom: 1px solid #e0e0e0; /* --rule-light */
        transition: border-color 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .home:hover {
        border-bottom-color: #0d0d0d;
      }

      .home:focus-visible {
        outline: 2px solid #0d0d0d;
        outline-offset: 3px;
        border-radius: 2px;
      }

      @media (min-width: 768px) {
        .wrap {
          padding-inline: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="label">404</p>
      <h1>Sorry, we can't find that page.</h1>
      <a class="home" href="/">Go back home</a>
    </main>
  </body>
</html>
