<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven Text Reveal Effect</title>
  
  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <!-- Google Fonts: Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      background-color: #fafaf9;
      color: #111827;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .spacer {
      height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .scroll-hint {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8A8A8A;
      margin-top: 1rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    .reveal-section {
      min-height: 120vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .reveal-text {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(2rem, 4.5vw, 4.2rem);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.02em;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35em 0.3em;
    }

    .word {
      color: #CCCCCC;
      opacity: 0.15;
      transition: color 0.1s ease;
      display: inline-block;
      will-change: color, opacity;
    }

    .footer-spacer {
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8A8A8A;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Top Hero Spacer -->
  <div class="spacer">
    <h1 style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 2.5rem; font-weight: 400; margin-bottom: 0.5rem;">
      Scroll-Driven Text Reveal
    </h1>
    <p style="color: #666; font-size: 1rem;">向下滾動以體驗逐詞揭示高亮效果</p>
    <div class="scroll-hint">↓ 向下滾動 Scroll Down ↓</div>
  </div>

  <!-- Text Reveal Section -->
  <section class="reveal-section" id="revealSection">
    <p class="reveal-text" id="revealText">
      Mercury delivers an enterprise intelligence engine for private wealth management, unifying multi-custodial assets, real-time analytics, and automated reporting into one seamless, elegant interface.
    </p>
  </section>

  <!-- Bottom Footer Spacer -->
  <div class="footer-spacer">
    <p>End of Scroll Reveal Demo</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Register ScrollTrigger plugin
      gsap.registerPlugin(ScrollTrigger);

      const revealText = document.getElementById("revealText");

      // 2. Split text into individual words wrapped in <span class="word">
      const textContent = revealText.textContent.trim();
      const wordsArray = textContent.split(/\s+/);
      
      revealText.innerHTML = wordsArray
        .map(word => `<span class="word">${word}</span>`)
        .join(" ");

      const wordSpans = revealText.querySelectorAll(".word");

      // 3. Create GSAP ScrollTrigger animation
      gsap.fromTo(
        wordSpans,
        {
          color: "#CCCCCC",
          opacity: 0.15
        },
        {
          color: "#000000",
          opacity: 1,
          stagger: 0.1,
          ease: "none",
          scrollTrigger: {
            trigger: "#revealSection",
            start: "top 75%",
            end: "bottom 35%",
            scrub: 0.5, // Smooth scrubbing effect based on scroll velocity
            markers: false // Set to true if debugging trigger lines
          }
        }
      );
    });
  </script>
</body>
</html>
